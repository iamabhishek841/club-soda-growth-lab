<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Club Soda Growth Lab architecture</title>
  <desc id="desc">Architecture flow from public observations and synthetic funnel inputs through reusable Python modules into the Streamlit application sections, with tests validating the growth model.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6D5DFB"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1E1D24" flood-opacity="0.08"/>
    </filter>
    <style>
      .bg{fill:#FCFCFE}
      .title{font:700 42px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1E1D24}
      .subtitle{font:400 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6B6874}
      .box{fill:#FFFFFF;stroke:#DDD9F8;stroke-width:2;rx:20;filter:url(#shadow)}
      .box2{fill:#F7F6FF;stroke:#CFC9FF;stroke-width:2;rx:20;filter:url(#shadow)}
      .box3{fill:#F2FBF9;stroke:#BFE8DF;stroke-width:2;rx:20;filter:url(#shadow)}
      .label{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1E1D24}
      .small{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6B6874}
      .mono{font:600 17px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#4B4770}
      .section{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6D5DFB;letter-spacing:1px}
      .arrow{stroke:#6D5DFB;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .arrow2{stroke:#14A38B;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .note{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6B6874}
    </style>
  </defs>

  <rect class="bg" width="1400" height="900"/>
  <text x="70" y="72" class="title">Club Soda Growth Lab — Architecture</text>
  <text x="70" y="108" class="subtitle">Public business context + synthetic funnel inputs → reusable model → Streamlit decision interface</text>

  <text x="70" y="165" class="section">INPUTS</text>
  <rect x="70" y="190" width="360" height="130" class="box"/>
  <text x="100" y="228" class="label">Public website observations</text>
  <text x="100" y="258" class="small">Club Soda home, events, shop, FAQ</text>
  <text x="100" y="286" class="small">and terms pages</text>

  <rect x="70" y="365" width="360" height="150" class="box3"/>
  <text x="100" y="403" class="label">Synthetic / user inputs</text>
  <text x="100" y="433" class="small">Visitors, funnel rates, AOV,</text>
  <text x="100" y="461" class="small">repeat-booking rate and uplifts</text>
  <text x="100" y="491" class="note">Illustrative only — no internal data</text>

  <text x="510" y="165" class="section">LOGIC LAYER</text>
  <rect x="510" y="190" width="370" height="130" class="box"/>
  <text x="540" y="228" class="mono">src/content.py</text>
  <text x="540" y="258" class="small">Structured observations and proposed</text>
  <text x="540" y="286" class="small">measurement-event taxonomy</text>

  <rect x="510" y="365" width="370" height="210" class="box2"/>
  <text x="540" y="403" class="mono">src/growth_model.py</text>
  <text x="540" y="436" class="small">calculate_funnel()</text>
  <text x="540" y="466" class="small">apply_uplifts()</text>
  <text x="540" y="496" class="small">compare_scenarios()</text>
  <text x="540" y="526" class="small">two_proportion_sample_size()</text>
  <text x="540" y="556" class="note">Baseline vs improved scenario math</text>

  <rect x="510" y="635" width="370" height="120" class="box"/>
  <text x="540" y="675" class="mono">tests/test_growth_model.py</text>
  <text x="540" y="706" class="small">Validates funnel math, uplifts</text>
  <text x="540" y="734" class="small">and sample-size helper</text>

  <text x="960" y="165" class="section">STREAMLIT EXPERIENCE</text>
  <rect x="960" y="190" width="370" height="385" class="box2"/>
  <text x="990" y="228" class="mono">app.py</text>
  <text x="990" y="268" class="label">Business-facing sections</text>

  <rect x="995" y="292" width="300" height="42" rx="12" fill="#FFFFFF" stroke="#E5E2F6"/>
  <text x="1015" y="319" class="small">Growth overview</text>

  <rect x="995" y="344" width="300" height="42" rx="12" fill="#FFFFFF" stroke="#E5E2F6"/>
  <text x="1015" y="371" class="small">Website opportunities</text>

  <rect x="995" y="396" width="300" height="42" rx="12" fill="#FFFFFF" stroke="#E5E2F6"/>
  <text x="1015" y="423" class="small">Funnel simulator</text>

  <rect x="995" y="448" width="300" height="42" rx="12" fill="#FFFFFF" stroke="#E5E2F6"/>
  <text x="1015" y="475" class="small">Campaign studio</text>

  <rect x="995" y="500" width="145" height="42" rx="12" fill="#FFFFFF" stroke="#E5E2F6"/>
  <text x="1015" y="527" class="small">Customer journey</text>

  <rect x="1150" y="500" width="145" height="42" rx="12" fill="#FFFFFF" stroke="#E5E2F6"/>
  <text x="1170" y="527" class="small">90-day plan</text>

  <path d="M430 255 C465 255 475 255 510 255" class="arrow"/>
  <path d="M430 440 C465 440 475 440 510 440" class="arrow2"/>
  <path d="M880 255 C915 255 925 255 960 255" class="arrow"/>
  <path d="M880 470 C915 470 925 420 960 420" class="arrow"/>
  <path d="M695 635 L695 585" class="arrow2"/>

  <rect x="70" y="805" width="1260" height="54" rx="15" fill="#F5F4FA"/>
  <text x="95" y="838" class="note">Key principle: public observations provide context; synthetic values drive the simulator; the model stays separate from the UI so the calculations are inspectable and testable.</text>
</svg>